name: Despliegue en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run test:db
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Servicios comunes de IA y de rutas: apagados salvo que la variable del repositorio diga 'true'.
          VITE_SHARED_AI_ENABLED: ${{ vars.VITE_SHARED_AI_ENABLED || 'false' }}
          VITE_SHARED_ORS_ENABLED: ${{ vars.VITE_SHARED_ORS_ENABLED || 'false' }}
          VITE_ROUTE_SOURCES_ENABLED: ${{ vars.VITE_ROUTE_SOURCES_ENABLED || 'false' }}
      - run: node scripts/check-bundle-secrets.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
